<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Token Glass — local AI activity, at a glance</title><desc id="desc">Illustrated Windows widget with clearly marked demo values. Rounded glass panel on an abstract blue background.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#152d43"/><stop offset=".55" stop-color="#466e88"/><stop offset="1" stop-color="#a8c2cf"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#d8eef1" stop-opacity=".7"/><stop offset="1" stop-color="#d8eef1" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x2=".7" y2="1"><stop stop-color="#f2fbff" stop-opacity=".4"/><stop offset=".5" stop-color="#c2d4e2" stop-opacity=".2"/><stop offset="1" stop-color="#d2e3eb" stop-opacity=".3"/></linearGradient>
<linearGradient id="rim" x2=".5" y2="1"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".65"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="shadow" x="-25%" y="-100%" width="150%" height="300%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071b2d" flood-opacity=".4"/></filter>
</defs>
<rect width="1200" height="600" rx="28" fill="url(#bg)"/>
<ellipse cx="920" cy="90" rx="450" ry="330" fill="url(#glow)"/>
<g fill="none" stroke="#d9e9ef" opacity=".15"><path d="M-80 590 Q200 60 670 400 T1350 200" stroke-width="115" filter="url(#blur)"/><path d="M-80 650 Q260 140 700 430 T1320 270" stroke-width="2"/><path d="M-80 665 Q260 155 700 445 T1320 285" stroke-width="1"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#eef8fb">
<text x="88" y="94" font-size="14" letter-spacing="4" opacity=".7">LOCAL AI ACTIVITY</text>
<text x="84" y="163" font-size="58" font-weight="600" letter-spacing="-2">A little glass.</text>
<text x="85" y="210" font-size="27" opacity=".85">A clearer view of your tokens.</text>
<g filter="url(#shadow)"><rect x="174" y="290" width="852" height="130" rx="46" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.4"/></g>
<rect x="183" y="299" width="244" height="112" rx="37" fill="#fff" fill-opacity=".12"/>
<rect x="179" y="295" width="842" height="120" rx="41" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
<text x="210" y="327" font-size="16" opacity=".88">TODAY · CODEX</text>
<text x="208" y="376" font-size="48" font-weight="600" letter-spacing="-1.8">1.28M</text>
<text x="210" y="399" font-size="13" opacity=".8">Local logs · demo values</text>
<path d="M448 312 V398" stroke="#fff" stroke-opacity=".25"/>
<text x="479" y="341" font-size="16" opacity=".85">TOTAL TOKENS</text>
<text x="622" y="347" font-size="40" font-weight="600">24.80M</text>
<g font-size="16"><text x="480" y="387" opacity=".8">Input</text><text x="527" y="387" font-weight="600">240K</text><text x="640" y="387" opacity=".8">Output</text><text x="702" y="387" font-weight="600">80K</text><text x="815" y="387" opacity=".8">Cache</text><text x="874" y="387" font-weight="600">960K</text></g>
<text x="972" y="344" font-size="30">···</text><path d="m979 379 6-6 6 6" stroke="#fff" stroke-width="1.6" fill="none"/>
<text x="88" y="508" font-size="16" opacity=".9">Codex</text><circle cx="162" cy="503" r="2" fill="#fff" opacity=".5"/><text x="178" y="508" font-size="16" opacity=".9">Claude Code</text><circle cx="290" cy="503" r="2" fill="#fff" opacity=".5"/><text x="306" y="508" font-size="16" opacity=".9">Optional browser text estimates</text>
<text x="88" y="541" font-size="13" opacity=".6">Windows native · Local processing · No npm dependencies</text>
<rect x="925" y="500" width="187" height="35" rx="18" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".2"/><text x="944" y="522" font-size="12" letter-spacing="1" opacity=".8">ILLUSTRATION / DEMO</text>
</g></svg>
